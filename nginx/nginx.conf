# Use Docker's embedded DNS so proxy_pass targets are re-resolved at runtime.
# IMPORTANT: with variables in proxy_pass (below), nginx re-resolves via this
# resolver instead of caching the IP at startup. This survives backend
# container recreation (new IPs) and prevents stale-upstream 502s.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Client body size limit (for PDF uploads)
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Crawler API endpoints (must be before / to match first)
    # /api/crawler/<path>  ->  crawler-api:8000/<path>
    location /api/crawler/ {
        # Rate limiting with burst
        limit_req zone=api_limit burst=20 nodelay;

        set $crawler_api crawler-api;
        rewrite ^/api/crawler/(.*)$ /$1 break;
        proxy_pass http://$crawler_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running crawler operations
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Converter API endpoints
    # /api/converter/<path>  ->  converter-api:8001/api/<path>
    location /api/converter/ {
        # Rate limiting with burst
        limit_req zone=api_limit burst=20 nodelay;

        set $converter_api converter-api;
        rewrite ^/api/converter/(.*)$ /api/$1 break;
        proxy_pass http://$converter_api:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for PDF processing
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Todo API endpoints (URI passed through unchanged)
    location ~ ^/api/todos(/.*)?$ {
        # Rate limiting with burst
        limit_req zone=api_limit burst=20 nodelay;

        set $todo_api todo-api;
        proxy_pass http://$todo_api:8002$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User Management API endpoints
    # /api/user-management/<path>  ->  user-management-api:8003/<path>
    location /api/user-management/ {
        # Rate limiting with burst
        limit_req zone=api_limit burst=20 nodelay;

        set $user_management_api user-management-api;
        rewrite ^/api/user-management/(.*)$ /$1 break;
        proxy_pass http://$user_management_api:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Crawler frontend
    # /crawler/<path>  ->  crawler-web:80/<path>
    location /crawler/ {
        set $crawler_web crawler-web;
        rewrite ^/crawler/(.*)$ /$1 break;
        proxy_pass http://$crawler_web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Converter frontend (React app) - URI passed through unchanged
    location /converter {
        set $converter_web converter-web;
        proxy_pass http://$converter_web:80$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo frontend (React app)
    # /todos/<path>  ->  todo-web:80/<path>
    location /todos/ {
        set $todo_web todo-web;
        rewrite ^/todos/(.*)$ /$1 break;
        proxy_pass http://$todo_web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /todos {
        return 301 /todos/;
    }

    # User Management frontend (React app)
    # /user-management/<path>  ->  user-management-web:80/<path>
    location /user-management/ {
        set $user_management_web user-management-web;
        rewrite ^/user-management/(.*)$ /$1 break;
        proxy_pass http://$user_management_web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /user-management {
        return 301 /user-management/;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Landing page and login (catch-all, must be last) - URI passed through unchanged
    location / {
        set $frontend frontend;
        proxy_pass http://$frontend:80$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
